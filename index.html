<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Nostro Matrimonio</title>
    
    <!-- Font eleganti da Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Cormorant Garamond', serif;
            background-color: #f4f1ea;
        }

        /* Sfondo della pagina sotto (visibile quando il cancello si apre) */
        #content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            font-size: 4rem;
            color: #3e2723;
            font-family: 'Great Vibes', cursive;
        }

        /* ===== CONTENITORE DEL CANCELLO ===== */
        #gate-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            z-index: 10;
            perspective: 2000px; /* Fondamentale per l'effetto 3D di apertura */
        }

        /* ===== SINGOLO BATTENTE ===== */
        .gate {
            width: 50%;
            height: 100%;
            position: relative;
            pointer-events: auto;
            cursor: pointer;
            /* Transizione lenta e "pesante" per simulare un cancello vero */
            transition: transform 3.5s cubic-bezier(0.65, 0, 0.35, 1);
            transform-style: preserve-3d;
            /* Sfondo in ferro scuro con texture */
            background: 
                linear-gradient(180deg, #2b1d14 0%, #1a110b 50%, #2b1d14 100%);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
        }

        .gate.left {
            transform-origin: left center;
            border-right: 3px solid #b8860b;
            /* Sbarre verticali */
            background-image: 
                repeating-linear-gradient(90deg, 
                    transparent 0px, 
                    transparent 40px, 
                    rgba(0,0,0,0.6) 40px, 
                    rgba(0,0,0,0.6) 48px,
                    transparent 48px,
                    transparent 88px
                ),
                linear-gradient(180deg, #2b1d14 0%, #1a110b 50%, #2b1d14 100%);
        }

        .gate.right {
            transform-origin: right center;
            border-left: 3px solid #b8860b;
            background-image: 
                repeating-linear-gradient(90deg, 
                    transparent 0px, 
                    transparent 40px, 
                    rgba(0,0,0,0.6) 40px, 
                    rgba(0,0,0,0.6) 48px,
                    transparent 48px,
                    transparent 88px
                ),
                linear-gradient(180deg, #2b1d14 0%, #1a110b 50%, #2b1d14 100%);
        }

        /* Pannello decorativo centrale in oro (dove stanno le lettere) */
        .gate::before {
            content: '';
            position: absolute;
            top: 50%;
            width: 60%;
            height: 40%;
            transform: translateY(-50%);
            border: 2px solid #b8860b;
            background: radial-gradient(ellipse at center, rgba(184,134,11,0.15) 0%, transparent 70%);
            box-shadow: 0 0 30px rgba(184,134,11,0.3), inset 0 0 30px rgba(0,0,0,0.5);
        }
        .gate.left::before { right: 0; border-right: none; }
        .gate.right::before { left: 0; border-left: none; }

        /* Decorazione floreale in alto */
        .gate::after {
            content: '❦';
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 4rem;
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212,175,55,0.6);
            opacity: 0.7;
        }

        /* ===== LETTERE M e L ===== */
        .initial {
            position: absolute;
            top: 50%;
            font-family: 'Great Vibes', cursive;
            font-size: 18vw;
            color: #d4af37;
            text-shadow: 
                0 0 20px rgba(212,175,55,0.6),
                2px 2px 4px rgba(0,0,0,0.8);
            user-select: none;
            z-index: 2;
            transform: translateY(-50%);
            line-height: 1;
        }
        .gate.left .initial { right: 8%; }
        .gate.right .initial { left: 8%; }

        /* Maniglia / medaglione centrale */
        .handle {
            position: absolute;
            top: 50%;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #f0d97a, #b8860b 60%, #6b4f0a);
            box-shadow: 0 0 15px rgba(212,175,55,0.8), inset 0 0 10px rgba(0,0,0,0.4);
            transform: translateY(-50%);
            z-index: 3;
        }
        .gate.left .handle { right: -30px; }
        .gate.right .handle { left: -30px; }

        /* ===== STATO APERTO ===== */
        #gate-container.open .left {
            transform: rotateY(-115deg);
        }
        #gate-container.open .right {
            transform: rotateY(115deg);
        }

        /* Quando il cancello è aperto, disabilitiamo i click */
        #gate-container.open {
            pointer-events: none;
        }

        /* Messaggio "clicca per aprire" */
        #hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #d4af37;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            z-index: 11;
            animation: pulse 2s infinite;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
        #gate-container.open ~ #hint { opacity: 0; }
    </style>
</head>
<body>

    <div id="content">
        Ciao
    </div>

    <div id="hint">Clicca per aprire</div>

    <div id="gate-container">
        <div class="gate left">
            <span class="initial">M</span>
            <div class="handle"></div>
        </div>
        <div class="gate right">
            <span class="initial">L</span>
            <div class="handle"></div>
        </div>
    </div>

    <script>
        const gateContainer = document.getElementById('gate-container');
        let isOpening = false;

        gateContainer.addEventListener('click', () => {
            if (isOpening) return; // Evita click multipli
            isOpening = true;
            
            // Piccolo "scatto" iniziale: il cancello si solleva leggermente
            // prima di aprirsi, come se si sbloccasse
            setTimeout(() => {
                gateContainer.classList.add('open');
            }, 200);

            // Rimuoviamo completamente il cancello dopo l'animazione
            setTimeout(() => {
                gateContainer.style.display = 'none';
            }, 4000);
        });
    </script>

</body>
</html>
