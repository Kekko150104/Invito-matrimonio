<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Nostro Matrimonio</title>
    <style>
        /* Stili di base per far scomparire i margini */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Evita che appaiano barre di scorrimento durante l'animazione */
            font-family: 'Georgia', serif;
            background-color: #f4f1ea; /* Colore di sfondo sotto il cancello */
        }

        /* Contenitore del cancello (inizialmente copre tutto) */
        #gate-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            z-index: 10;
            pointer-events: none; /* Permette ai click di passare attraverso i lati vuoti */
        }

        /* I due battenti del cancello */
        .gate {
            width: 50%;
            height: 100%;
            background-color: #3e2723; /* Colore marrone scuro del legno/ferro */
            background-image: repeating-linear-gradient(
                45deg,
                rgba(255,255,255,0.05) 0px,
                rgba(255,255,255,0.05) 2px,
                transparent 2px,
                transparent 10px
            ); /* Texture leggera per simulare le incisioni */
            transition: transform 1.5s cubic-bezier(0.77, 0, 0.175, 1); /* Animazione fluida */
            position: relative;
            pointer-events: auto; /* Rende i battenti cliccabili */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gate.left {
            transform-origin: left center;
        }

        .gate.right {
            transform-origin: right center;
        }

        /* Stile per le lettere M e L */
        .initial {
            color: #d4af37; /* Colore oro */
            font-size: 15vw; /* Dimensione grande e responsive */
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            user-select: none; /* Evita che il testo venga selezionato al click */
        }

        /* Quando il cancello è aperto, ruota i battenti verso l'esterno */
        #gate-container.open .left {
            transform: rotateY(-110deg); /* Apre verso sinistra */
        }

        #gate-container.open .right {
            transform: rotateY(110deg); /* Apre verso destra */
        }

        /* Stile per la pagina sotto (il contenuto) */
        #content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            font-size: 3rem;
            color: #3e2723;
        }
    </style>
</head>
<body>

    <!-- Il contenuto che apparirà dopo l'apertura del cancello -->
    <div id="content">
        Ciao
    </div>

    <!-- Il cancello che copre tutto -->
    <div id="gate-container">
        <!-- Battente sinistro con la M -->
        <div class="gate left">
            <span class="initial">M</span>
        </div>
        <!-- Battente destro con la L -->
        <div class="gate right">
            <span class="initial">L</span>
        </div>
    </div>

    <script>
        // Prendiamo il contenitore del cancello
        const gateContainer = document.getElementById('gate-container');

        // Aggiungiamo un ascoltatore di eventi per il click su tutta l'area del cancello
        gateContainer.addEventListener('click', () => {
            // Aggiungiamo la classe 'open' che farà partire l'animazione CSS
            gateContainer.classList.add('open');
            
            // Dopo l'animazione, nascondiamo completamente il cancello
            // Il tempo (1500ms) corrisponde alla durata della transizione CSS
            setTimeout(() => {
                gateContainer.style.display = 'none';
            }, 1500);
        });
    </script>

</body>
</html>
